[pytest]
# 只收集本專案的測試。不指定的話 `pytest -q` 會連 third_party/llama.cpp 的
# 測試一起收集，而那些在 import 期就會失敗（缺 wget / gguf 等上游測試依賴），
# 導致整個 run_tests.sh 停在 "4 errors during collection"，看起來像我們的
# 測試壞了。third_party 是廠商程式碼，它的測試不歸我們跑。
testpaths =
    tests
    server/streaming/tests

# 一條測試卡超過 60 秒就把所有執行緒的堆疊倒出來。用內建的 faulthandler
# 而不是 pytest-timeout：不必多裝套件，換一台機器 clone 下來就有效。
# 它不會中斷測試，但會直接指出卡在哪一行——卡住而沒有線索才是最難查的。
faulthandler_timeout = 60
